<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}User{% endblock %}</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#f5f5f5;
        }

        .topbar{
            background:#2c3e50;
            color:white;
            padding:15px;
            display:flex;
            justify-content:space-between;
        }

        .container{
            padding:20px;
        }

        .btn{
            padding:8px 15px;
            background:#3498db;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .btn:hover{
            background:#2980b9;
        }
    </style>
</head>

<body>

<div class="topbar">
    <div>{% block topbar_title %}Dashboard{% endblock %}</div>
    <div>
        <a href="/logout/" class="btn">Logout</a>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
