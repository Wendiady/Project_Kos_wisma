{% extends 'kos/base_user.html' %}
{% block title %}Profil Penyewa{% endblock %}

{% block content %}
<style>
    /* Mengurangi margin body agar container lebih naik */
    .container {
        max-width: 450px;
        margin: 10px auto; /* Jarak atas diperkecil */
        background: white;
        padding: 20px; /* Padding dikurangi */
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h2 { text-align: center; margin-bottom: 15px; font-size: 22px; }

    label { font-size: 12px; font-weight: bold; margin-bottom: 2px; display: block; }

    input {
        width: 100%;
        padding: 8px; /* Input lebih tipis */
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 13px;
    }

    .btn-group { display: flex; gap: 10px; margin-top: 5px; }

    .btn {
        flex: 1;
        padding: 8px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
    }

    img {
        width: 100%;
        max-width: 150px; /* Foto diperkecil agar tidak makan tempat */
        margin: 5px auto;
        display: block;
        border-radius: 8px;
    }

    .alert { padding: 5px; margin-bottom: 10px; border-radius: 6px; text-align: center; font-size: 12px; }
</style>

<div class="container">
    <h2>Profil Saya</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert success">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Nama</label>
        <input type="text" value="{{ penyewa.nama }}" readonly>

        <label>No HP</label>
        <input type="text" name="no_hp" value="{{ penyewa.no_hp }}">

        <label>NIK</label>
        <input type="text" name="nik" value="{{ penyewa.nik }}">

        <label>Upload KTP</label>
        <input type="file" name="foto_ktp">

        {% if penyewa.foto_ktp %}
            <p style="font-size: 11px; margin: 0;">Foto Saat Ini:</p>
            <img src="{{ penyewa.foto_ktp.url }}">
        {% endif %}

        <div class="btn-group">
            <a href="{% url 'dashboard_penyewa' %}" class="btn" style="background:#3498db; color:white; text-decoration:none; display:flex; align-items:center; justify-content:center;">Kembali</a>
            <button type="submit" class="btn" style="background:#2ecc71; color:white;">Simpan</button>
        </div>
    </form>
</div>

<script>
    setTimeout(function(){
        let alert = document.querySelector('.alert');
        if(alert){ alert.style.display = 'none'; }
    }, 2000);
</script>
{% endblock %}
