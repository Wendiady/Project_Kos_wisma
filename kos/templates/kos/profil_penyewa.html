{% extends 'kos/base_user.html' %}

{% block title %}Profil Penyewa{% endblock %}

{% block content %}

<style>
.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:6px;
}

.btn-group{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.btn{
    flex:1;
    padding:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    text-align:center;
    font-weight:bold;
    transition:0.2s;
}

.btn-save{
    background:#2ecc71;
    color:white;
}

.btn-back{
    background:#3498db;
    color:white;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
}

.btn:hover{
    opacity:0.9;
    transform:scale(1.02);
}

img{
    width:100%;
    max-width:250px;
    margin-top:10px;
    border-radius:8px;
}

/* NOTIFIKASI */
.alert{
    padding:10px;
    margin-bottom:15px;
    border-radius:6px;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#d4edda;
    color:#155724;
}
</style>

<div class="container">

<h2>Profil Saya</h2>

<!-- 🔥 NOTIFIKASI -->
{% if messages %}
    {% for message in messages %}
        <div class="alert success">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Nama</label>
    <input type="text" value="{{ penyewa.nama }}" readonly>

    <label>No HP</label>
    <input type="text" name="no_hp" value="{{ penyewa.no_hp }}">

    <label>NIK</label>
    <input type="text" name="nik" value="{{ penyewa.nik }}">

    <label>Upload KTP</label>
    <input type="file" name="foto_ktp">

    {% if penyewa.foto_ktp %}
        <p>Foto Saat Ini:</p>
        <img src="{{ penyewa.foto_ktp.url }}">
    {% endif %}

    <!-- 🔥 TOMBOL SEJAJAR -->
    <div class="btn-group">
        <a href="{% url 'dashboard_penyewa' %}" class="btn btn-back">
            Kembali
        </a>
        <button type="submit" class="btn btn-save">
            Simpan
        </button>

    </div>

</form>

</div>

<!-- 🔥 AUTO HILANG NOTIF -->
<script>
setTimeout(function(){
    let alert = document.querySelector('.alert');
    if(alert){
        alert.style.display = 'none';
    }
}, 3000);
</script>

{% endblock %}
