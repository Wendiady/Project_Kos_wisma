<!DOCTYPE html>
<html>
<head>
<title>Tambah Penyewa</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    padding:40px;
}

.card{
    background:white;
    padding:30px;
    max-width:500px;
    margin:auto;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    padding:10px 15px;
    background:#3b6e85;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:6px;
    width:100%;
}

button:hover{
    background:#2c5f73;
}

.info{
    color:red;
    margin-bottom:10px;
    font-size:14px;
}

/* 🔥 fasilitas biar rapi */
.fasilitas{
    margin-bottom:20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.fasilitas label{
    background:#f1f1f1;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
    border:1px solid #ddd;
    transition:0.2s;
}

.fasilitas label:hover{
    background:#e0eef5;
}

.fasilitas input{
    margin-right:5px;
}
</style>

</head>

<body>

<div class="card">

<h2>Tambah Penyewa</h2>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<label>Nama Penyewa</label>
<input type="text" name="nama" required>

<label>No HP</label>
<input type="text" name="no_hp" required>

<label>NIK</label>
<input type="text" name="nik" maxlength="16" required>

<label>Upload Foto KTP</label>
<input type="file" name="foto_ktp" accept="image/*" required>

<label>Username</label>
<input type="text" name="username" placeholder="Masukkan username" required>

<label>Password</label>
<input type="password" name="password" placeholder="Masukkan password" required>

<!-- 🔥 FASILITAS -->
<label>Fasilitas</label>
<div class="fasilitas">
{% for f in fasilitas %}
<label>
    <input type="checkbox" name="fasilitas" value="{{ f.id }}">
    {{ f.nama }}
</label>
{% endfor %}
</div>

<label>Kamar</label>
{% if kamar %}
<select name="kamar" required>
{% for k in kamar %}
<option value="{{k.id}}">
Kamar {{k.nomor_kamar}}
</option>
{% endfor %}
</select>
{% else %}
<div class="info">
Tidak ada kamar kosong.
</div>
<select disabled>
<option>Tidak ada kamar</option>
</select>
{% endif %}

<label>Tanggal Masuk</label>
<input type="date" name="tanggal_masuk" required>

{% if kamar %}
<button type="submit">Simpan</button>
{% else %}
<button disabled>Tidak Bisa Simpan</button>
{% endif %}

</form>

</div>

</body>
</html>
