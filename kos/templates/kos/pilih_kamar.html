<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Kamar - Wisma 24 Putra</title>
    <!-- Menggunakan Tailwind CSS untuk styling cepat dan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen m-0">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-slate-200">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Pilih Kamar Kost</h2>
            <p class="text-sm text-slate-500 mt-1">Silakan pilih kamar yang tersedia untuk melanjutkan</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Daftar Kamar</label>
                <select name="kamar" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-slate-700 bg-white shadow-sm transition">
                    <option value="">-- Pilih Kamar --</option>
                    {% for k in kamar_list %}
                        <option value="{{ k.id }}">
                            Kamar {{ k.nomor_kamar }} - Rp {{ k.harga }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition duration-200">
                Simpan & Pilih Kamar
            </button>
        </form>

        <!-- Tombol Kembali -->
        <div class="mt-4 text-center">
            <a href="javascript:history.back()" class="inline-block w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 px-4 rounded-xl transition duration-200">
                Kembali
            </a>
        </div>
    </div>

</body>
</html>
