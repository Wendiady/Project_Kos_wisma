{% extends 'kos/base_admin.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<style>

/* SECTION FASILITAS */
.section-fasilitas{
    margin-top:40px;
    background:#ffffff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.section-title{
    margin-bottom:20px;
    font-size:18px;
    font-weight:600;
    color:#333;
}

/* GRID */
.fasilitas-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

/* CARD INPUT */
.fasilitas-card{
    background:#f9fafb;
    padding:15px;
    border-radius:10px;
    border:1px solid #eee;
}

/* LABEL */
.label{
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
    color:#444;
}

/* INPUT */
.fasilitas-card input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    outline:none;
    transition:0.2s;
}

.fasilitas-card input:focus{
    border-color:#3b6e85;
    box-shadow:0 0 5px rgba(59,110,133,0.3);
}

/* BUTTON */
.btn-save{
    margin-top:20px;
    background:#3b6e85;
    color:white;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.btn-save:hover{
    background:#2c5568;
}

</style>


<!-- 🔽 HARGA FASILITAS -->
<div class="section-fasilitas">

    <h3 class="section-title">⚙ Manajemen Harga Fasilitas</h3>

    <form method="POST" action="{% url 'update_harga_fasilitas' %}">
        {% csrf_token %}

        <div class="fasilitas-grid">

            <div class="fasilitas-card">
                <div class="label">📶 WiFi</div>
                <input type="number" name="wifi" value="{{ harga.wifi }}">
            </div>

            <div class="fasilitas-card">
                <div class="label">❄ AC</div>
                <input type="number" name="ac" value="{{ harga.ac }}">
            </div>

            <div class="fasilitas-card">
                <div class="label">🌀 Kipas Angin</div>
                <input type="number" name="kipas_angin" value="{{ harga.kipas_angin }}">
            </div>

            <div class="fasilitas-card">
                <div class="label">🍚 Rice Cooker</div>
                <input type="number" name="rice_cooker" value="{{ harga.rice_cooker }}">
            </div>

        </div>

        <button type="submit" class="btn-save">
            💾 Simpan Perubahan
        </button>

    </form>

</div>

{% endblock %}
