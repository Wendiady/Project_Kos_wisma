<!DOCTYPE html>
<html>
<head>
<title>Tambah Tagihan</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:40px;
}

.card{
background:white;
padding:30px;
max-width:500px;
margin:auto;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select{
width:100%;
padding:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:10px 15px;
background:#3b6e85;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#2c5f73;
}

h3{
margin-top:15px;
}
</style>
</head>

<body>

<div class="card">

<h2>Tambah Tagihan</h2>

<form method="POST">
{% csrf_token %}

<label>Penyewa</label>
<select name="penyewa" required>
{% for p in penyewa %}
<option value="{{p.id}}">
{{p.nama}} - Kamar {{p.kamar.nomor_kamar}}
</option>
{% endfor %}
</select>

<label>Bulan</label>
<input type="text" name="bulan" placeholder="Contoh: Januari" required>

<label>Tahun</label>
<input type="number" name="tahun" placeholder="2026" required>

<label>Biaya Listrik</label>
<input type="number" name="listrik" value="0" required>

<label>Biaya Air</label>
<input type="number" name="air" value="0" required>

<hr>

<h3>Fasilitas</h3>

<label><input type="checkbox" name="fasilitas" value="WiFi"> WiFi</label><br>
<label><input type="checkbox" name="fasilitas" value="AC"> AC</label><br>
<label><input type="checkbox" name="fasilitas" value="Rice Cooker"> Rice Cooker</label><br>
<label><input type="checkbox" name="fasilitas" value="Kipas Angin"> Kipas Angin</label><br>

<hr>

<label>Tanggal Jatuh Tempo</label>
<input type="date" name="jatuh_tempo">

<button type="submit">Simpan</button>

</form>

</div>

</body>
</html>
