<!DOCTYPE html>
<html>
<head>
<title>Riwayat Penyewa</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:40px;
}

.btn{
display:inline-block;
padding:8px 15px;
background:#3b6e85;
color:white;
text-decoration:none;
border-radius:5px;
margin-bottom:20px;
}

table{
border-collapse:collapse;
width:100%;
background:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#3b6e85;
color:white;
}
</style>

</head>

<body>

<h2>Riwayat Penyewa (Sudah Keluar)</h2>

<a href="/penyewa/" class="btn">← Kembali</a>

<table>

<tr>
<th>Nama</th>
<th>Kamar</th>
<th>Tanggal Masuk</th>
<th>Tanggal Keluar</th>
</tr>

{% for p in penyewa %}

<tr>
<td>{{ p.nama }}</td>
<td>{{ p.kamar.nomor_kamar }}</td>
<td>{{ p.tanggal_masuk }}</td>
<td>{{ p.tanggal_keluar }}</td>
</tr>

{% empty %}
<tr>
<td colspan="4">Belum ada riwayat</td>
</tr>
{% endfor %}

</table>

</body>
</html>
