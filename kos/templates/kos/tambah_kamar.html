<!DOCTYPE html>
<html>
<head>
<title>Tambah Kamar</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f4f7f6;
        padding: 40px;
        display: flex;
        justify-content: center;
    }

    .card {
        background: white;
        padding: 30px;
        width: 100%;
        max-width: 450px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
        color: #17324f;
        margin-top: 0;
        margin-bottom: 25px;
        text-align: center;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }

    input, select {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
    }

    .button-group {
        display: flex;
        gap: 12px;
        margin-top: 10px;
    }

    button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.3s ease;
    }

    .btn-simpan {
        background: #1d74b7;
        color: white;
    }

    .btn-simpan:hover { background: #14598c; }

    .btn-kembali {
        background: #6c757d;
        color: white;
    }

    .btn-kembali:hover { background: #5a6268; }
</style>
</head>

<body>

<div class="card">
    <h2>Tambah Kamar</h2>
    <form method="POST">
        {% csrf_token %}

        <label>Nomor Kamar</label>
        <input type="text" name="nomor_kamar" required>

        <label>Harga</label>
        <input type="number" name="harga" required>

        <label>Status</label>
        <select name="status">
            <option value="Kosong">Kosong</option>
            <option value="Terisi">Terisi</option>
        </select>

        <div class="button-group">
            <button type="button" class="btn-kembali" onclick="history.back()">Kembali</button>
            <button type="submit" class="btn-simpan">Simpan</button>
        </div>
    </form>
</div>

</body>
</html>
